version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-app
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - fastapi_cache:/data
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  fastapi_cache:
  caddy_data:
  caddy_config: