[project]
name = "pitcher-stats"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = ["pybaseball", 
    "questionary", 
    "requests", "fastapi",
    "uvicorn[standard]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_stats"]

[project.scripts]
pitcher-stats = "baseball_stats.api.main:app"