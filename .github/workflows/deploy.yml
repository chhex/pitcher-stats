name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Self-hosted Runner auf NUC 2 (Keller), hinter Cloudflare Tunnel.
  deploy-nuc2:
    runs-on: [self-hosted, Linux, nuc2]
    concurrency:
      group: deploy-nuc2
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Start
        run: |
          set -e
          docker compose -f docker-compose.nuc.yaml up --build -d --remove-orphans
          docker image prune -f

      - name: Smoke-Test
        run: |
          sleep 5
          curl -fsS -o /dev/null http://127.0.0.1:8081/ && echo "Frontend OK"
