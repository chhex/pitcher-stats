name: Continuous Deployment Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Startet nur, wenn sich im Backend etwas ändert

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Deploy via SSH ausführen
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          sscript: |
            cd /apps/baseball-stats || exit
            git pull origin main
            
            # Hier sagen wir Docker, dass es die Produktions-Datei nutzen soll:
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up --build -d